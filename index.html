
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jibli - جيب لي</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 450px;
      padding: 25px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .title {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      color: #ff4d4d;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: #222;
      margin-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background-color: #fafafa;
      transition: 0.2s;
    }

    input:focus, textarea:focus {
      border-color: #ff4d4d;
      background-color: #fff;
    }

    .btn-submit {
      width: 100%;
      background-color: #25D366;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }

    .btn-submit:hover {
      background-color: #20ba5a;
    }

    .note {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">
      🚀 Jibli - جيب لي
    </div>

    <!-- الطلب -->
    <div class="form-group">
      <label>📦 أشنو بغيتي نجيبو ليك؟</label>
      <textarea id="items" rows="3" placeholder="مثلاً: غداء من سناك البركة، دوا من صيدلية المركز..."></textarea>
    </div>

    <!-- الانطلاق -->
    <div class="form-group">
      <label>📍 عنوان الانطلاق (منين ناخدو الطلب):</label>
      <input type="text" id="pickup" placeholder="مثلاً: سناك البركة، حي السلام، القنيطرة">
    </div>

    <!-- الوصول -->
    <div class="form-group">
      <label>🎯 عنوان الوصول (فين نجيبوه ليك):</label>
      <input type="text" id="dropoff" placeholder="مثلاً: زنقة 5، رقم 12، حي الوفاء، القنيطرة">
    </div>

    <!-- زر الواتساب -->
    <button class="btn-submit" onclick="sendWhatsApp()">
      📲 أرسل الطلب عبر الواتساب
    </button>

    <div class="note">
      🗺️ سيتم إنشاء رابط مباشر لخريطة Google Maps فور إرسال الطلب
    </div>
  </div>

  <script>
    function sendWhatsApp() {
      const items = document.getElementById('items').value.trim();
      const pickup = document.getElementById('pickup').value.trim();
      const dropoff = document.getElementById('dropoff').value.trim();

      if (!items || !pickup || !dropoff) {
        alert('عفاك عمر كاع الخانات باش نقدرو نوصّلو ليك الطلب!');
        return;
      }

      // ⚠️ بدل هاد النمرة بنمرتك ديال الواتساب (بدون + وبدون 0 فـ الأول)
      const phone = "212600000000"; 

      const message = `السلام عليكم، بغيت نطلب التوصيل مع Jibli 🚀%0A%0A📦 *الطلب:* ${encodeURIComponent(items)}%0A%0A📍 *مكان الانطلاق:* ${encodeURIComponent(pickup)}%0A%0A🎯 *مكان الوصول:* ${encodeURIComponent(dropoff)}`;

      window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
    }
  </script>

</body>
</html>
