
<!doctype html>
<html lang="fr" id="html-root">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JibLi-vraison | Service de livraison</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#090909;color:#fff;overflow-x:hidden}
a{text-decoration:none;color:inherit}
.c{width:92%;max-width:1100px;margin:auto}

header{position:sticky;top:0;background:#090909ee;border-bottom:1px solid #292929;z-index:999}
nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:5px}
.brand{font-size:20px;font-weight:900;font-style:italic;white-space:nowrap;direction:ltr !important;}
.brand span{color:#ffb900}
.links{display:flex;gap:20px;font-size:14px}
.btn{display:inline-block;padding:10px 14px;border-radius:11px;font-weight:800;cursor:pointer;border:none;font-size:13px;white-space:nowrap}
.yellow{background:#ffb900;color:#111}
.dark{background:#171717;border:1px solid #555;color:#fff}

.phone-num, .poster-container, #map {
  direction: ltr !important;
}

.lang-select {
  background: #171717;
  color: #ffb900;
  border: 1px solid #ffb900;
  padding: 4px 6px;
  border-radius: 6px;
  font-weight: bold;
  font-size: 11px;
  cursor: pointer;
  outline: none;
  max-width: 75px;
  direction: ltr !important;
}

.hero{padding:40px 0;background:radial-gradient(circle at 50% 30%,#ffb90015,transparent 50%)}
.poster-container{width:100%;max-width:900px;margin:0 auto 25px auto}
.hero-actions{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}

section{padding:50px 0}
.title{text-align:center;font-size:35px}
.sub{text-align:center;color:#aaa}
.cards,.steps,.why{display:grid;gap:16px}
.cards{grid-template-columns:repeat(3,1fr)}
.steps{grid-template-columns:repeat(4,1fr)}
.why{grid-template-columns:repeat(4,1fr)}
.card,.step,.whyitem,.tarif,.faq details{background:#151515;border:1px solid #2b2b2b;border-radius:17px;padding:24px}
.icon{font-size:30px}
.card p,.step p,.whyitem small,.answer{color:#aaa}
.num{width:38px;height:38px;background:#ffb900;color:#111;border-radius:50%;display:grid;place-items:center;font-weight:900}
.whyitem{text-align:center}
.whyitem span{font-size:28px}
.tarif{max-width:650px;margin:auto;text-align:center;padding:20px}
.result{font-size:32px;font-weight:900;color:#ffb900;margin:12px 0;direction:ltr !important;}
.cta{background:linear-gradient(135deg,#ffb900,#f08d00);color:#111;border-radius:23px;padding:40px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.cta h2{font-size:32px;margin:0}
.cta .btn{background:#111;color:#fff}
footer{padding:28px 0;border-top:1px solid #292929;color:#aaa}
.wa{position:fixed;right:20px;bottom:25px;width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;font-size:28px;z-index:9999;box-shadow:0 4px 15px rgba(0,0,0,0.5)}

@media(max-width:800px){
  .links{display:none}
  .cards,.steps,.why{grid-template-columns:1fr}
  .hero{padding:20px 0}
  .cta{display:block}
  .cta .btn{margin-top:20px}
  .tarif{padding:15px 12px}
  .brand{font-size:18px}
}

.search-box { position: relative; width: 100%; text-align: initial; }
.input-wrapper { position: relative; flex: 1; display: flex; align-items: center; }
.input-group { display: flex; gap: 8px; position: relative; z-index: 10; }
.search-input { width: 100%; padding: 14px 14px; border-radius: 10px; border: 1px solid #555; background: #1a1a1a; color: #fff; font-size: 15px; outline: none; }
.search-input:focus { border-color: #ffb900; }

.gps-btn { background: #222; border: 1px solid #ffb900; color: #ffb900; padding: 0 12px; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 13px; }

.mode-selector { display: flex; gap: 10px; margin-bottom: 20px; background: #222; padding: 5px; border-radius: 12px; }
.mode-btn { flex: 1; padding: 12px 8px; border: none; background: transparent; color: #aaa; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 13px; }
.mode-btn.active { background: #ffb900; color: #111; }

.map-wrapper { position: relative; width: 100%; height: 350px; margin-top: 10px; border-radius: 15px; overflow: hidden; border: 2px solid #ffb900; }
#map { width: 100%; height: 100%; }

/* Style des suggestions Google Places */
.pac-container {
  background-color: #1e1e1e !important;
  border: 1px solid #ffb900 !important;
  border-radius: 8px !important;
  font-family: Arial, sans-serif !important;
}
.pac-item {
  color: #fff !important;
  border-top: 1px solid #333 !important;
  padding: 8px !important;
  cursor: pointer !important;
}
.pac-item:hover {
  background-color: #2a2a2a !important;
}
.pac-item-query {
  color: #ffb900 !important;
}
.pac-matched {
  color: #ffb900 !important;
}
</style>
</head>
<body>

<header><div class="c"><nav><a class="brand" href="#">JibLi-<span>vraison</span></a><div class="links"><a href="#services" data-key="nav-services">Services</a><a href="#tarifs" data-key="nav-tarifs">Tarifs</a><a href="#comment" data-key="nav-comment">Comment ça marche</a><a href="#pourquoi" data-key="nav-pourquoi">Pourquoi nous</a><a href="#faq" data-key="nav-faq">FAQ</a></div><div style="display:flex;gap:5px;align-items:center">
<select class="lang-select" onchange="changeLanguage(this.value)">
  <option value="fr">🇫🇷 FR</option>
  <option value="ar">🇲🇦 AR</option>
  <option value="dar">🗣️ DAR</option>
</select>
<a class="btn dark" href="mailto:jibli.vraison@gmail.com">Email</a><a class="btn yellow" href="https://wa.me/212634084543">WhatsApp</a></div></nav></div></header>

<section id="tarifs"><div class="c"><h2 class="title" data-key="tarif-title">Commander ma livraison</h2><p class="sub" data-key="tarif-sub">Choisissez vos adresses sur la carte ou recherchez par nom.</p><div class="tarif">

<div class="mode-selector">
  <button type="button" class="mode-btn active" id="btn-mode-auto" onclick="switchMode('auto')" data-key="m-auto">🗺️ Par Carte / Recherche</button>
  <button type="button" class="mode-btn" id="btn-mode-manual" onclick="switchMode('manual')" data-key="m-manual">✍️ Saisie directe</button>
</div>

<!-- MODE AUTOMATIQUE & CARTE GOOGLE -->
<div id="section-auto">
  <div style="display:grid;gap:15px;margin-bottom:18px;text-align:start;">
    <div>
      <label style="font-weight:700;display:block;margin-bottom:5px" data-key="lbl-dep">🚦🟢 Départ</label>
      <div class="search-box">
        <div class="input-group">
          <div class="input-wrapper">
            <input type="text" id="input-depart" class="search-input" placeholder="Ex: Gare Kenitra, Marjane..." autocomplete="off">
          </div>
          <button type="button" class="gps-btn" onclick="useCurrentLocation(true)">🎯 GPS</button>
        </div>
      </div>
    </div>

    <div>
      <label style="font-weight:700;display:block;margin-bottom:5px" data-key="lbl-dest">🚦🔴 Destination</label>
      <div class="search-box">
        <div class="input-group">
          <div class="input-wrapper">
            <input type="text" id="input-dest" class="search-input" placeholder="Ex: Mehdia, Café..." autocomplete="off">
          </div>
          <button type="button" class="gps-btn" onclick="useCurrentLocation(false)">🎯 GPS</button>
        </div>
      </div>
    </div>
  </div>

  <div class="map-wrapper">
    <div id="map"></div>
  </div>
</div>

<!-- MODE SAISIE MANUELLE -->
<div id="section-manual" style="display:none; text-align:start;">
  <div style="display:grid;gap:15px;margin-bottom:18px;">
    <div>
      <label style="font-weight:700;display:block;margin-bottom:5px" data-key="lbl-dep-m">📍 Lieu de Départ (Optionnel)</label>
      <input type="text" id="manual-depart" class="search-input" style="width:100%" placeholder="Ex: Gare Kenitra..." oninput="calculateManualPrice()">
    </div>
    <div>
      <label style="font-weight:700;display:block;margin-bottom:5px" data-key="lbl-dest-m">🏁 Destination (Optionnel)</label>
      <input type="text" id="manual-dest" class="search-input" style="width:100%" placeholder="Ex: Mehdia..." oninput="calculateManualPrice()">
    </div>
    <div>
      <label style="font-weight:700;display:block;margin-bottom:5px" data-key="lbl-dist-m">📏 Distance estimée (en km)</label>
      <input type="number" id="manual-dist" class="search-input" style="width:100%" placeholder="Ex: 6" step="0.1" min="0" oninput="calculateManualPrice()">
    </div>
  </div>
</div>

<div class="result" id="result">— DH</div>
<p id="status" style="color:#aaa;margin-bottom:15px;" data-key="status-default">Sélectionnez les lieux pour afficher le tarif.</p>

<a id="order" class="btn yellow" href="https://wa.me/212634084543" style="width:100%;text-align:center;" data-key="btn-wa">Commander sur WhatsApp</a>
</div></div></section>

<!-- GOOGLE MAPS SCRIPT AVEC VOTRE CLÉ API -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBMGZwRva0eYjD8ZJ2Ql8r9P4Dgm0qNYLY&libraries=places&callback=initMap" async defer></script>

<script>
let map, directionsService, directionsRenderer;
let depPlace = null, destPlace = null;
let currentMode = 'auto';
let currentLang = 'fr';

const translations = {
  fr: { "tarif-title": "Commander ma livraison", "m-auto": "🗺️ Par Carte / Recherche", "m-manual": "✍️ Saisie directe", "lbl-dep": "🚦🟢 Départ", "lbl-dest": "🚦🔴 Destination", "btn-wa": "Commander sur WhatsApp", "status-default": "Sélectionnez les lieux ou entrez la distance pour afficher le tarif." },
  ar: { "tarif-title": "طلب التوصيل", "m-auto": "🗺️ عبر الخريطة / البحث", "m-manual": "✍️ إدخال مباشر", "lbl-dep": "🚦🟢 مكان الانطلاق", "lbl-dest": "🚦🔴 الوجهة", "btn-wa": "اطلب عبر واتساب", "status-default": "حدد الأماكن أو أدخل المسافة لعرض السعر." },
  dar: { "tarif-title": "طلب التوصيل ديالك", "m-auto": "🗺️ الخريطة والبحث", "m-manual": "✍️ كتب بيديك", "lbl-dep": "🚦🟢 منين نجيبو", "lbl-dest": "🚦🔴 فين ندبو", "btn-wa": "طلب ف الواتساب", "status-default": "عزل البلايص أو كتب الكيلومتراج باش يبان لك الثمن." }
};

function initMap() {
  const kenitra = { lat: 34.2610, lng: -6.5802 };
  map = new google.maps.Map(document.getElementById("map"), {
    zoom: 13,
    center: kenitra,
    disableDefaultUI: false
  });

  directionsService = new google.maps.DirectionsService();
  directionsRenderer = new google.maps.DirectionsRenderer({ map: map });

  const options = {
    componentRestrictions: { country: "ma" }
  };

  const inputDep = document.getElementById("input-depart");
  const inputDest = document.getElementById("input-dest");

  const autocompleteDep = new google.maps.places.Autocomplete(inputDep, options);
  const autocompleteDest = new google.maps.places.Autocomplete(inputDest, options);

  autocompleteDep.addListener("place_changed", () => {
    depPlace = autocompleteDep.getPlace();
    if (depPlace.geometry) {
      calculateGoogleRoute();
    }
  });

  autocompleteDest.addListener("place_changed", () => {
    destPlace = autocompleteDest.getPlace();
    if (destPlace.geometry) {
      calculateGoogleRoute();
    }
  });
}

function calculateGoogleRoute() {
  if (!depPlace || !destPlace) return;

  directionsService.route(
    {
      origin: depPlace.geometry.location,
      destination: destPlace.geometry.location,
      travelMode: google.maps.TravelMode.DRIVING
    },
    (response, status) => {
      if (status === "OK") {
        directionsRenderer.setDirections(response);
        const route = response.routes[0].legs[0];
        const distKm = route.distance.value / 1000;
        
        const depLat = depPlace.geometry.location.lat();
        const depLng = depPlace.geometry.location.lng();
        const destLat = destPlace.geometry.location.lat();
        const destLng = destPlace.geometry.location.lng();
        
        renderPrice(distKm, depPlace.name || depPlace.formatted_address, destPlace.name || destPlace.formatted_address, depLat, depLng, destLat, destLng);
      }
    }
  );
}

function getPriceFromKm(n) {
  return n <= 4 ? 20 : n < 6 ? 25 : n < 7 ? 26 : n < 8 ? 27 : n < 9 ? 28 : n < 10 ? 29 : 35 + Math.ceil(n - 10) * 2;
}

function renderPrice(n, dep, dest, depLat, depLng, destLat, destLng) {
  let price = getPriceFromKm(n);
  document.getElementById('result').textContent = price + ' DH';
  document.getElementById('status').textContent = 'Distance : ' + n.toFixed(1) + ' km';

  let mapLink = `https://www.google.com/maps/dir/?api=1&origin=${depLat},${depLng}&destination=${destLat},${destLng}&travelmode=driving`;

  let msg = `Bonjour JibLi-vraison 👋\nJe souhaite une livraison.\n\n📍 Départ : ${dep}\n🏁 Destination : ${dest}\n📏 Distance : ${n.toFixed(1)} km\n💰 Prix : ${price} DH\n\n🗺️ Trajet Google Maps :\n${mapLink}`;
  document.getElementById('order').href = 'https://api.whatsapp.com/send?phone=212634084543&text=' + encodeURIComponent(msg);
}

function calculateManualPrice() {
  const distVal = parseFloat(document.getElementById('manual-dist').value);
  const depVal = document.getElementById('manual-depart').value || 'Non spécifié';
  const destVal = document.getElementById('manual-dest').value || 'Non spécifié';

  if (!isNaN(distVal) && distVal > 0) {
    let price = getPriceFromKm(distVal);
    document.getElementById('result').textContent = price + ' DH';
    document.getElementById('status').textContent = 'Distance saisie : ' + distVal.toFixed(1) + ' km';

    let msg = `Bonjour JibLi-vraison 👋\nJe souhaite une livraison.\n\n📍 Départ : ${depVal}\n🏁 Destination : ${destVal}\n📏 Distance : ${distVal.toFixed(1)} km\n💰 Prix : ${price} DH`;
    document.getElementById('order').href = 'https://api.whatsapp.com/send?phone=212634084543&text=' + encodeURIComponent(msg);
  } else {
    document.getElementById('result').textContent = '— DH';
    document.getElementById('status').textContent = 'Entrez une distance valide.';
  }
}

function useCurrentLocation(isDepart) {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(position => {
      const pos = { lat: position.coords.latitude, lng: position.coords.longitude };
      const geocoder = new google.maps.Geocoder();
      geocoder.geocode({ location: pos }, (results, status) => {
        if (status === "OK" && results[0]) {
          if (isDepart) {
            depPlace = { geometry: { location: new google.maps.LatLng(pos.lat, pos.lng) }, formatted_address: results[0].formatted_address, name: "Ma position GPS" };
            document.getElementById("input-depart").value = results[0].formatted_address;
          } else {
            destPlace = { geometry: { location: new google.maps.LatLng(pos.lat, pos.lng) }, formatted_address: results[0].formatted_address, name: "Ma position GPS" };
            document.getElementById("input-dest").value = results[0].formatted_address;
          }
          calculateGoogleRoute();
        }
      });
    });
  }
}

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('btn-mode-auto').classList.toggle('active', mode === 'auto');
  document.getElementById('btn-mode-manual').classList.toggle('active', mode === 'manual');
  document.getElementById('section-auto').style.display = mode === 'auto' ? 'block' : 'none';
  document.getElementById('section-manual').style.display = mode === 'manual' ? 'block' : 'none';
}

function changeLanguage(lang) {
  currentLang = lang;
  document.getElementById('html-root').setAttribute('dir', lang === 'fr' ? 'ltr' : 'rtl');
  
  const dict = translations[lang] || translations.fr;
  for (let key in dict) {
    let el = document.querySelector(`[data-key="${key}"]`);
    if (el) el.textContent = dict[key];
  }
}
</script>
</body>
</html>
