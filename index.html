<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JibLi-vraison | Service de livraison nocturne à Kénitra</title>
  
  <!-- Mapbox GL JS & Geocoder CSS/JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" type="text/css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #090909; color: #ffffff; }
    
    header {
      position: sticky; top: 0; background: #090909ee; border-bottom: 1px solid #222;
      padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; z-index: 100;
    }
    .logo { font-size: 24px; font-weight: bold; color: #fff; }
    .logo span { color: #ffb900; }
    .btn-contact {
      background: #ffb900; color: #000; padding: 10px 20px; text-decoration: none;
      font-weight: bold; border-radius: 5px; transition: 0.3s;
    }
    .btn-contact:hover { background: #e0a300; }

    .hero {
      padding: 60px 5%; text-align: center;
      background: radial-gradient(circle at 50% 20%, #1a1500 0%, #090909 70%);
    }
    .badge {
      background: rgba(255, 185, 0, 0.15); color: #ffb900; padding: 6px 16px;
      border-radius: 20px; font-size: 14px; display: inline-block; margin-bottom: 15px;
      border: 1px solid rgba(255, 185, 0, 0.3);
    }
    h1 { font-size: 38px; margin-bottom: 10px; }
    p.sub { color: #aaa; margin-bottom: 30px; font-size: 18px; }

    /* Calculator Section */
    .calculator-container {
      max-width: 900px; margin: 0 auto; background: #121212; border: 1px solid #222;
      border-radius: 12px; padding: 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }
    @media (max-width: 768px) {
      .calculator-container { grid-template-columns: 1fr; }
    }

    .inputs-box { display: flex; flex-direction: column; gap: 15px; text-align: left; }
    .input-group label { display: block; margin-bottom: 5px; color: #ddd; font-size: 14px; }
    .mapboxgl-ctrl-geocoder { width: 100% !important; max-width: none !important; background-color: #1e1e1e !important; border: 1px solid #333 !important; border-radius: 6px !important; }
    .mapboxgl-ctrl-geocoder input { color: #fff !important; }

    .result-card {
      background: #181818; border: 1px solid #ffb90044; border-radius: 8px; padding: 20px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    .result-card h3 { color: #aaa; font-size: 16px; margin-bottom: 10px; }
    .price-tag { font-size: 36px; font-weight: bold; color: #ffb900; margin: 10px 0; }
    .distance-tag { color: #888; font-size: 15px; }

    #map { width: 100%; height: 300px; border-radius: 8px; margin-top: 20px; }

    footer { text-align: center; padding: 30px; color: #555; border-top: 1px solid #111; margin-top: 50px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">JibLi<span>-vraison</span></div>
    <a href="https://wa.me/212600000000" class="btn-contact" target="_blank">WhatsApp</a>
  </header>

  <section class="hero">
    <div class="badge">🌙 Service Nocturne à Kénitra (16H00 - 04H00)</div>
    <h1>Une livraison. Simple. Rapide.</h1>
    <p class="sub">Calculateur de tarif en temps réel selon la distance</p>

    <div class="calculator-container">
      <div class="inputs-box">
        <div class="input-group">
          <label>📍 Lieu de Départ (L'adresse de départ)</label>
          <div id="geocoder-start"></div>
        </div>
        <div class="input-group">
          <label>🏁 Destination (L'adresse d'arrivée)</label>
          <div id="geocoder-end"></div>
        </div>
      </div>

      <div class="result-card">
        <h3>Tarif Estimé</h3>
        <div class="price-tag" id="price-display">0 DH</div>
        <div class="distance-tag" id="distance-display">Distance : 0.0 km</div>
      </div>
    </div>

    <div style="max-width: 900px; margin: 20px auto 0 auto;">
      <div id="map"></div>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 JibLi-vraison Kénitra. Tous droits réservés.</p>
  </footer>

  <script>
    // ⚠️ بدل هاد السطر بالـ Access Token ديالك من Mapbox
    mapboxgl.accessToken = 'YOUR_MAPBOX_ACCESS_TOKEN';

    let startCoord = null;
    let endCoord = null;

    // Center on Kenitra, Morocco
    const kenitraBounds = [-6.65, 34.20, -6.50, 34.32]; // Bounding box for Kenitra

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/dark-v11',
      center: [-6.5802, 34.2610], // Kenitra Center
      zoom: 12
    });

    // Geocoder Start
    const geocoderStart = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: 'Départ (ex: Maamora, Kénitra)',
      bbox: kenitraBounds,
      proximity: { longitude: -6.5802, latitude: 34.2610 }
    });

    // Geocoder End
    const geocoderEnd = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: 'Arrivée (ex: Mehdia, Kénitra)',
      bbox: kenitraBounds,
      proximity: { longitude: -6.5802, latitude: 34.2610 }
    });

    document.getElementById('geocoder-start').appendChild(geocoderStart.onAdd(map));
    document.getElementById('geocoder-end').appendChild(geocoderEnd.onAdd(map));

    geocoderStart.on('result', (e) => {
      startCoord = e.result.geometry.coordinates;
      calculatePrice();
    });

    geocoderEnd.on('result', (e) => {
      endCoord = e.result.geometry.coordinates;
      calculatePrice();
    });

    // Haversine Distance Calculation Formula
    function getDistance(coord1, coord2) {
      const R = 6371; // Earth radius in km
      const dLat = (coord2[1] - coord1[1]) * Math.PI / 180;
      const dLon = (coord2[0] - coord1[0]) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(coord1[1] * Math.PI / 180) * Math.cos(coord2[1] * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function calculatePrice() {
      if (startCoord && endCoord) {
        const dist = getDistance(startCoord, endCoord);
        
        // Base Price Logic (مثال: 10 دراهم أول 2 كلم + 3 دراهم لكل كلم إضافي)
        let price = 10;
        if (dist > 2) {
          price += Math.ceil(dist - 2) * 3;
        }

        document.getElementById('distance-display').innerText = `Distance : ${dist.toFixed(1)} km`;
        document.getElementById('price-display').innerText = `${price} DH`;
      }
    }
  </script>
</body>
</html>
