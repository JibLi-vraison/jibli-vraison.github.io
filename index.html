<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jibli - جيب لي</title>
  <style>
    :root { --primary: #FF5722; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #f4f6f7; padding: 20px 10px; direction: rtl; }
    
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 20px;
      font-size: 26px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 87, 34, 0.1);
    }

    .btn {
      width: 100%;
      background: #25D366;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .btn:hover { background: #1EBE5D; }
    .note { font-size: 13px; color: #777; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 Jibli - جيب لي</h1>

    <div class="form-group">
      <label>📦 أشنو بغيتي نجيبو ليك؟</label>
      <textarea id="items" rows="3" placeholder="مثلاً: غداء من سناك البركة، دوا من صيدلية المركز..."></textarea>
    </div>

    <div class="form-group">
      <label>📍 عنوان الانطلاق (منين ناخدو الطلب):</label>
      <input type="text" id="pickup" placeholder="مثلاً: سناك البركة، حي السلام، القنيطرة">
    </div>

    <div class="form-group">
      <label>🎯 عنوان الوصول (فين نجيبوه ليك):</label>
      <input type="text" id="dropoff" placeholder="مثلاً: زنقة 5، رقم 12، حي الوفاء، القنيطرة">
    </div>

    <button class="btn" onclick="sendOrder()">
      📲 أرسل الطلب عبر الواتساب
    </button>

    <p class="note">🗺️ سيتم إنشاء رابط مباشر لخريطة Google Maps فور إرسال الطلب</p>
  </div>

  <script>
    function sendOrder() {
      const items = document.getElementById('items').value;
      const pickup = document.getElementById('pickup').value;
      const dropoff = document.getElementById('dropoff').value;

      if (!items || !pickup || !dropoff) {
        alert('عفاك دخل كاع المعلومات باش نكَمّلو الطلب!');
        return;
      }

      // رابط مباشر يفتح المسار المظبوط فـ Google Maps
      const gmapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(pickup)}&destination=${encodeURIComponent(dropoff)}`;

      const phone = "212600000000"; // ⚠️ أكتب رقم الواتساب ديالك هنا
      
      const text = `سلام، بغيت نطلب التوصيل مع Jibli 🚀%0A%0A📦 *الطلب:* ${items}%0A📍 *من:* ${pickup}%0A🎯 *إلى:* ${dropoff}%0A%0A🗺️ *رابط المسار فـ Google Maps:*%0A${encodeURIComponent(gmapsUrl)}`;

      window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
    }
  </script>
</body>
</html>
