<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jibli - جيب لي</title>

  <!-- Mapbox CSS & JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  
  <!-- Mapbox Geocoder (Search Autocomplete) -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" type="text/css">

  <style>
    :root { var(--primary): #FF5722; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #f4f6f7; padding: 15px; direction: rtl; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #FF5722; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    .geocoder-container { width: 100%; margin-bottom: 10px; }
    .mapboxgl-ctrl-geocoder { width: 100% !important; max-width: none !important; border: 1px solid #ccc; border-radius: 8px; box-shadow: none; }
    #map { height: 220px; border-radius: 8px; margin: 15px 0; }
    .price-box { background: #fff3e0; color: #e65100; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 16px; margin-bottom: 15px; }
    .btn { width: 100%; background: #25D366; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🚀 Jibli - جيب لي</h2>

    <div class="form-group">
      <label>📦 أشنو بغيتي نجيبو ليك؟</label>
      <textarea id="items" rows="2" placeholder="اكتب طلبك هنا..."></textarea>
    </div>

    <div class="form-group">
      <label>📍 مكان الانطلاق (المطعم / المحل):</label>
      <div id="geocoder-pickup" class="geocoder-container"></div>
    </div>

    <div class="form-group">
      <label>🎯 مكان الوصول (العنوان ديالك):</label>
      <div id="geocoder-dropoff" class="geocoder-container"></div>
    </div>

    <div id="map"></div>

    <div class="price-box" id="price-box">💰 الثمن المتوقع: -- درهم</div>

    <button class="btn" onclick="sendOrder()">📲 إرسال الطلب عبر الواتساب</button>
  </div>

  <script>
    // ⚠️ حط الـ Public Token ديال Mapbox هنا بين المعقوفتين:
    const MAPBOX_TOKEN = 'YOUR_MAPBOX_ACCESS_TOKEN'; 
    mapboxgl.accessToken = MAPBOX_TOKEN;

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [-7.5898, 33.5731], // كازابلانكا كبداية
      zoom: 11
    });

    let pickupCoords = null;
    let dropoffCoords = null;
    let pickupName = '';
    let dropoffName = '';

    // إعداد البحث التلقائي للانطلاق
    const geocoderPickup = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: 'ابحث عن مكان الانطلاق...',
      countries: 'ma', // البحث فالمغرب فقط
      language: 'ar'
    });

    // إعداد البحث التلقائي للوصول
    const geocoderDropoff = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: 'ابحث عن مكان الوصول...',
      countries: 'ma',
      language: 'ar'
    });

    document.getElementById('geocoder-pickup').appendChild(geocoderPickup.onAdd(map));
    document.getElementById('geocoder-dropoff').appendChild(geocoderDropoff.onAdd(map));

    geocoderPickup.on('result', (e) => {
      pickupCoords = e.result.center;
      pickupName = e.result.place_name;
      calculatePrice();
    });

    geocoderDropoff.on('result', (e) => {
      dropoffCoords = e.result.center;
      dropoffName = e.result.place_name;
      calculatePrice();
    });

    function calculatePrice() {
      if (!pickupCoords || !dropoffCoords) return;

      // حساب المسافة بالكيلومتر
      const R = 6371;
      const dLat = (dropoffCoords[1] - pickupCoords[1]) * Math.PI / 180;
      const dLon = (dropoffCoords[0] - pickupCoords[0]) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(pickupCoords[1] * Math.PI / 180) * Math.cos(dropoffCoords[1] * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const distance = R * c;

      let price = Math.round(10 + (distance * 3)); // 10 دراهم + 3 دراهم لكل كلم
      if (price < 12) price = 12;

      document.getElementById('price-box').innerText = `💰 الثمن المتوقع: ${price} درهم (${distance.toFixed(1)} كم)`;
    }

    function sendOrder() {
      const items = document.getElementById('items').value;
      if (!items || !pickupCoords || !dropoffCoords) {
        alert('عفاك دخل الطلب والأماكن بجوج!');
        return;
      }

      const phone = "212600000000"; // رقمك
      const text = `سلام، بغيت نطلب التوصيل 🚀%0A%0A📦 *الطلب:* ${items}%0A📍 *من:* ${pickupName}%0A🎯 *إلى:* ${dropoffName}`;
      window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
    }
  </script>
</body>
</html>
